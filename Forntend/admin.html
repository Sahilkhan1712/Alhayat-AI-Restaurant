<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlHayat Admin Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

    <div class="container py-4">

        <h1 class="text-warning text-center mb-4">
            AlHayat Admin Panel
        </h1>

        <!-- Dashboard -->

        <div class="row mb-4">

            <div class="col-md-3 mb-3">
                <div class="card bg-primary text-white text-center p-3">
                    <h2 id="totalOrders">0</h2>
                    <h5>Total Orders</h5>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="card bg-warning text-dark text-center p-3">
                    <h2 id="pendingOrders">0</h2>
                    <h5>Pending</h5>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="card bg-success text-white text-center p-3">
                    <h2 id="deliveredOrders">0</h2>
                    <h5>Delivered</h5>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="card bg-danger text-white text-center p-3">
                    <h2 id="totalRevenue">₹0</h2>
                    <h5>Total Revenue</h5>
                </div>
            </div>

        </div>
        <div class="card p-4 mt-4">
    <h3 class="text-center text-warning">
        Sales Analytics
    </h3>

    <canvas id="salesChart"></canvas>
</div>
        <div class="card p-3 mt-4">
    <h3 class="text-center text-success">
         Best Selling Items
    </h3>

    <div id="bestSellingItems"></div>
</div>

        <!-- Search -->

        <input type="text" id="searchOrder" class="form-control mb-3" placeholder="🔍 Search Customer..."
            onkeyup="loadOrders()">

        <!-- Filter -->

        <select id="statusFilter" class="form-select mb-4" onchange="loadOrders()">

            <option value="">All Orders</option>
            <option value="Pending">Pending</option>
            <option value="Accepted">Accepted</option>
            <option value="Delivered">Delivered</option>
            <option value="Preparing">Preparing</option>
            <option value="Out For Delivery">Out For Delivery</option>
        </select>

        <!-- Orders -->

        <div id="orders"></div>
        <h2 class="text-warning mt-5">
    Table Reservations
</h2>

<div id="reservationList"
     class="row g-3">
</div>

    </div>
    <audio id="notificationSound">
        <source src="notification.mp3" type="audio/mpeg">
    </audio>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="http://localhost:8000/socket.io/socket.io.js"></script>

<script src="admin.js"></script>
</body>

</html>
