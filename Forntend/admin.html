<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlHayat Admin Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* =========================================================
   ALHAYAT ADMIN PANEL — PREMIUM 3D GLASS UI
   CSS ONLY — FUNCTIONALITY UNCHANGED
========================================================= */

        body {
            background:
                radial-gradient(circle at 15% 10%, rgba(255, 193, 7, .12), transparent 28%),
                radial-gradient(circle at 85% 20%, rgba(255, 140, 0, .08), transparent 25%),
                radial-gradient(circle at 50% 100%, rgba(255, 193, 7, .05), transparent 30%),
                linear-gradient(135deg, #050607, #101418 50%, #050607) !important;

            color: #f5f5f5 !important;
            min-height: 100vh;
        }

        /* MAIN CONTAINER */

        .container {
            max-width: 1450px;
        }

        /* =========================================================
   MAIN TITLE
========================================================= */

        .container>h1 {
            font-size: 46px;
            font-weight: 900;
            letter-spacing: 1px;

            color: #ffc107 !important;

            text-shadow:
                0 0 8px rgba(255, 193, 7, .8),
                0 0 22px rgba(255, 193, 7, .35),
                0 4px 15px rgba(0, 0, 0, .8);

            margin-bottom: 35px !important;
        }

        /* =========================================================
   STAT CARDS
========================================================= */

        .row.mb-4 .card {

            min-height: 135px;

            border-radius: 22px !important;

            border: 1px solid rgba(255, 255, 255, .18) !important;

            box-shadow:
                0 18px 35px rgba(0, 0, 0, .5),
                inset 0 1px 1px rgba(255, 255, 255, .18),
                inset 0 -8px 20px rgba(0, 0, 0, .12);

            position: relative;
            overflow: hidden;

            transition:
                transform .35s ease,
                box-shadow .35s ease;
        }

        /* GLASS SHINE */

        .row.mb-4 .card::before {

            content: "";

            position: absolute;

            top: -60%;
            left: -30%;

            width: 60%;
            height: 220%;

            background:
                linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, .16),
                    transparent);

            transform: rotate(20deg);

            transition: .6s ease;
        }

        .row.mb-4 .card:hover::before {
            left: 120%;
        }

        /* HOVER 3D */

        .row.mb-4 .card:hover {

            transform:
                translateY(-8px) scale(1.025);

            box-shadow:
                0 25px 45px rgba(0, 0, 0, .65),
                0 0 30px rgba(255, 193, 7, .2),
                inset 0 1px 1px rgba(255, 255, 255, .2);
        }

        .row.mb-4 .card h2 {

            position: relative;

            font-size: 38px;

            font-weight: 900;

            margin-bottom: 5px;
        }

        .row.mb-4 .card h5 {

            position: relative;

            font-size: 17px;

            font-weight: 700;

            letter-spacing: .4px;
        }

        /* =========================================================
   DASHBOARD GLASS CARDS
========================================================= */

        .container>.card {

            background:
                linear-gradient(145deg,
                    rgba(27, 33, 38, .96),
                    rgba(8, 11, 13, .98)) !important;

            color: #fff !important;

            border: 1px solid rgba(255, 193, 7, .3) !important;

            border-radius: 24px !important;

            box-shadow:
                0 20px 45px rgba(0, 0, 0, .55),
                inset 0 1px 1px rgba(255, 255, 255, .08),
                inset 0 -10px 25px rgba(0, 0, 0, .2);

            position: relative;

            overflow: hidden;
        }

        /* GOLD TOP LINE */

        .container>.card::before {

            content: "";

            position: absolute;

            left: 8%;
            right: 8%;
            top: 0;

            height: 2px;

            background:
                linear-gradient(90deg,
                    transparent,
                    #ffc107,
                    #ffe082,
                    #ffc107,
                    transparent);

            box-shadow:
                0 0 15px rgba(255, 193, 7, .8);
        }

        /* SECTION TITLES */

        .container>.card h3 {

            font-weight: 800;

            text-shadow:
                0 0 12px rgba(255, 193, 7, .25);
        }

        /* =========================================================
   SALES CHART
========================================================= */

        #salesChart {

            max-height: 470px;

            margin-top: 10px;
        }

        /* =========================================================
   BEST SELLING ITEMS
========================================================= */

        #bestSellingItems {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;
        }

        #bestSellingItems p {

            margin: 0;

            padding: 15px 18px;

            border-radius: 14px;

            background:
                linear-gradient(145deg,
                    rgba(35, 41, 46, .95),
                    rgba(15, 18, 20, .95));

            border: 1px solid rgba(255, 193, 7, .18);

            box-shadow:
                0 8px 18px rgba(0, 0, 0, .3),
                inset 0 1px 0 rgba(255, 255, 255, .05);

            transition: all .3s ease;
        }

        #bestSellingItems p:hover {

            transform:
                translateY(-4px) translateX(2px);

            border-color: rgba(255, 193, 7, .65);

            box-shadow:
                0 12px 25px rgba(0, 0, 0, .45),
                0 0 18px rgba(255, 193, 7, .12);
        }

        /* =========================================================
   SEARCH
========================================================= */

        #searchOrder {

            background:
                linear-gradient(145deg,
                    #1c2328,
                    #0c1013) !important;

            color: #fff !important;

            border: 1px solid rgba(255, 193, 7, .3) !important;

            border-radius: 14px;

            padding: 14px 18px;

            box-shadow:
                inset 0 2px 8px rgba(0, 0, 0, .4),
                0 6px 18px rgba(0, 0, 0, .25);
        }

        #searchOrder::placeholder {
            color: #9da3a8;
        }

        #searchOrder:focus {

            border-color: #ffc107 !important;

            box-shadow:
                0 0 0 3px rgba(255, 193, 7, .1),
                0 0 20px rgba(255, 193, 7, .12) !important;
        }

        /* =========================================================
   FILTER
========================================================= */

        #statusFilter {

            background:
                linear-gradient(145deg,
                    #1c2328,
                    #0c1013) !important;

            color: #fff !important;

            border: 1px solid rgba(255, 193, 7, .3) !important;

            border-radius: 14px;

            padding: 14px 18px;

            box-shadow:
                inset 0 2px 8px rgba(0, 0, 0, .4),
                0 6px 18px rgba(0, 0, 0, .25);
        }

        /* =========================================================
   ORDERS
========================================================= */

        #orders .card {

            background:
                linear-gradient(145deg,
                    rgba(31, 38, 43, .98),
                    rgba(10, 13, 15, .98)) !important;

            color: #fff !important;

            border: 1px solid rgba(255, 193, 7, .28) !important;

            border-radius: 22px !important;

            padding: 27px !important;

            box-shadow:
                0 18px 40px rgba(0, 0, 0, .55),
                inset 0 1px 0 rgba(255, 255, 255, .07),
                inset 0 -10px 20px rgba(0, 0, 0, .15);

            position: relative;

            overflow: hidden;

            transition: all .35s ease;
        }

        /* GOLD EDGE */

        #orders .card::before {

            content: "";

            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            width: 3px;

            background:
                linear-gradient(180deg,
                    transparent,
                    #ffc107,
                    #ffe082,
                    #ffc107,
                    transparent);

            box-shadow:
                0 0 15px rgba(255, 193, 7, .7);
        }

        /* ORDER HOVER */

        #orders .card:hover {

            transform:
                translateY(-6px) perspective(800px) rotateX(1deg);

            border-color:
                rgba(255, 193, 7, .65) !important;

            box-shadow:
                0 28px 55px rgba(0, 0, 0, .65),
                0 0 28px rgba(255, 193, 7, .12);
        }

        /* CUSTOMER */

        #orders .card h3 {

            color: #ffc107;

            font-size: 25px;

            font-weight: 800;

            text-shadow:
                0 0 10px rgba(255, 193, 7, .25);
        }

        /* ORDER DETAILS */

        #orders .card p {

            background:
                rgba(255, 255, 255, .035);

            border:
                1px solid rgba(255, 255, 255, .06);

            border-radius: 10px;

            padding: 11px 14px;

            margin: 9px 0;

            transition: .25s ease;
        }

        #orders .card p:hover {

            background:
                rgba(255, 193, 7, .05);

            border-color:
                rgba(255, 193, 7, .2);
        }

        /* FOOD ITEMS */

        #orders .card ul {

            background:
                linear-gradient(145deg,
                    rgba(5, 8, 10, .7),
                    rgba(18, 22, 25, .7));

            border:
                1px solid rgba(255, 193, 7, .12);

            border-radius: 14px;

            padding: 15px 18px 15px 35px;

            box-shadow:
                inset 0 2px 10px rgba(0, 0, 0, .3);
        }

        #orders .card li {

            padding: 9px 0;

            border-bottom:
                1px solid rgba(255, 255, 255, .06);
        }

        #orders .card li:last-child {
            border-bottom: none;
        }

        /* TOTAL */

        #orders .card h5 {

            color: #ffc107;

            font-size: 23px;

            margin-top: 20px;
        }

        /* STATUS */

        #orders .card h6 {

            display: inline-block;

            padding: 8px 14px;

            border-radius: 20px;

            background:
                rgba(13, 110, 253, .1);

            border:
                1px solid rgba(13, 110, 253, .3);

            font-weight: 700;
        }

        /* =========================================================
   ORDER BUTTONS
========================================================= */

        #orders .btn {

            border-radius: 11px;

            padding: 12px;

            font-weight: 700;

            border: 1px solid rgba(255, 255, 255, .08);

            box-shadow:
                0 5px 12px rgba(0, 0, 0, .25);

            transition: all .25s ease;
        }

        #orders .btn:hover {

            transform:
                translateY(-3px) scale(1.01);

            box-shadow:
                0 10px 22px rgba(0, 0, 0, .45);
        }

        /* =========================================================
   RESERVATIONS
========================================================= */

        #reservationList .card {

            background:
                linear-gradient(145deg,
                    #20272c,
                    #0d1113) !important;

            color: #fff !important;

            border:
                1px solid rgba(255, 193, 7, .22);

            border-radius: 18px;

            box-shadow:
                0 12px 28px rgba(0, 0, 0, .4),
                inset 0 1px 0 rgba(255, 255, 255, .05);

            transition: .3s ease;
        }

        #reservationList .card:hover {

            transform: translateY(-5px);

            border-color:
                rgba(255, 193, 7, .55);

            box-shadow:
                0 18px 35px rgba(0, 0, 0, .55),
                0 0 20px rgba(255, 193, 7, .1);
        }

        #reservationList .card h5 {

            color: #ffc107;

            font-weight: 800;
        }

        /* =========================================================
   MOBILE
========================================================= */

        @media (max-width: 768px) {

            .container {
                padding-left: 12px !important;
                padding-right: 12px !important;
            }

            .container>h1 {

                font-size: 31px;

                margin-top: 10px;
            }

            .row.mb-4 .card {

                min-height: 115px;

                border-radius: 18px !important;
            }

            .row.mb-4 .card h2 {
                font-size: 30px;
            }

            #bestSellingItems {

                grid-template-columns: 1fr;
            }

            #orders .card {

                padding: 18px !important;

                border-radius: 17px !important;
            }

            #orders .card h3 {

                font-size: 21px;

                word-break: break-word;
            }

            #orders .card p {

                font-size: 14px;

                line-height: 1.5;
            }

            #orders .card li {

                font-size: 14px;

                line-height: 1.5;
            }

            #salesChart {

                max-height: 320px;
            }

        }

        /* =========================================================
   PREMIUM COLORED 3D STAT CARDS
========================================================= */

        /* TOTAL ORDERS - BLUE */

        .row.mb-4 .col-md-3:nth-child(1) .card {
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, .22), transparent 25%),
                linear-gradient(135deg,
                    #0878ff 0%,
                    #0758d9 45%,
                    #063aa8 100%) !important;

            color: white !important;

            border: 1px solid rgba(80, 180, 255, .8) !important;

            box-shadow:
                0 15px 30px rgba(0, 70, 180, .45),
                0 0 25px rgba(0, 140, 255, .25),
                inset 0 2px 2px rgba(255, 255, 255, .3),
                inset 0 -12px 20px rgba(0, 0, 80, .18);
        }


        /* PENDING - GOLD */

        .row.mb-4 .col-md-3:nth-child(2) .card {
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, .28), transparent 25%),
                linear-gradient(135deg,
                    #ffd43b 0%,
                    #ffbd00 45%,
                    #e89b00 100%) !important;

            color: #171717 !important;

            border: 1px solid rgba(255, 225, 100, .9) !important;

            box-shadow:
                0 15px 30px rgba(220, 150, 0, .4),
                0 0 28px rgba(255, 193, 7, .3),
                inset 0 2px 2px rgba(255, 255, 255, .35),
                inset 0 -12px 20px rgba(120, 70, 0, .15);
        }


        /* DELIVERED - GREEN */

        .row.mb-4 .col-md-3:nth-child(3) .card {
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, .2), transparent 25%),
                linear-gradient(135deg,
                    #20b96b 0%,
                    #149653 45%,
                    #08763f 100%) !important;

            color: white !important;

            border: 1px solid rgba(80, 255, 170, .65) !important;

            box-shadow:
                0 15px 30px rgba(0, 130, 70, .4),
                0 0 28px rgba(0, 255, 140, .18),
                inset 0 2px 2px rgba(255, 255, 255, .25),
                inset 0 -12px 20px rgba(0, 70, 40, .18);
        }


        /* TOTAL REVENUE - PURPLE / MAGENTA */

        .row.mb-4 .col-md-3:nth-child(4) .card {
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, .22), transparent 25%),
                linear-gradient(135deg,
                    #e83cff 0%,
                    #b51fd8 45%,
                    #7513a5 100%) !important;

            color: white !important;

            border: 1px solid rgba(255, 120, 255, .7) !important;

            box-shadow:
                0 15px 30px rgba(150, 0, 190, .4),
                0 0 30px rgba(230, 50, 255, .25),
                inset 0 2px 2px rgba(255, 255, 255, .3),
                inset 0 -12px 20px rgba(80, 0, 100, .2);
        }


        /* =========================================================
   CARD CONTENT
========================================================= */

        .row.mb-4 .card h2 {
            text-shadow:
                0 3px 8px rgba(0, 0, 0, .35);
        }

        .row.mb-4 .card h5 {
            text-shadow:
                0 2px 5px rgba(0, 0, 0, .25);
        }


        /* =========================================================
   3D HOVER
========================================================= */

        .row.mb-4 .card:hover {

            transform:
                translateY(-8px) scale(1.025);

            transition: all .3s ease;
        }


        /* =========================================================
   GLASS SHINE
========================================================= */

        .row.mb-4 .card::after {

            content: "";

            position: absolute;

            top: -80%;
            left: -40%;

            width: 55%;
            height: 250%;

            background:
                linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, .20),
                    transparent);

            transform: rotate(25deg);

            transition: .7s ease;

            pointer-events: none;
        }

        .row.mb-4 .card:hover::after {
            left: 130%;
        }

        /* ================================
   PREMIUM ADMIN PROFILE
================================ */

        .admin-profile {
            width: min(420px, 92%);
            margin: 0 auto 30px;
            padding: 25px 20px;
            position: relative;
            overflow: hidden;

            background:
                radial-gradient(circle at 20% 10%,
                    rgba(255, 193, 7, 0.22),
                    transparent 35%),
                linear-gradient(145deg,
                    rgba(35, 35, 35, 0.95),
                    rgba(10, 10, 10, 0.98));

            border: 1px solid rgba(255, 193, 7, 0.45);
            border-radius: 24px;

            box-shadow:
                0 20px 45px rgba(0, 0, 0, 0.65),
                0 0 30px rgba(255, 193, 7, 0.12),
                inset 0 1px 1px rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            transition: all 0.35s ease;
        }

        /* Golden top glow */
        .admin-profile::before {
            content: "";
            position: absolute;
            top: 0;
            left: 15%;
            width: 70%;
            height: 2px;

            background: linear-gradient(90deg,
                    transparent,
                    #ffc107,
                    #ffe082,
                    #ffc107,
                    transparent);

            box-shadow: 0 0 15px rgba(255, 193, 7, 0.8);
        }

        /* Shine effect */
        .admin-profile::after {
            content: "";
            position: absolute;
            top: -80%;
            left: -60%;
            width: 35%;
            height: 250%;

            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.15),
                    transparent);

            transform: rotate(25deg);
            transition: 0.8s ease;
            pointer-events: none;
        }

        .admin-profile:hover {
            transform: translateY(-6px);

            box-shadow:
                0 25px 55px rgba(0, 0, 0, 0.75),
                0 0 35px rgba(255, 193, 7, 0.25),
                inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }

        .admin-profile:hover::after {
            left: 130%;
        }

        /* Admin Avatar */
        .admin-avatar {
            width: 75px;
            height: 75px;

            margin: 0 auto 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;

            background:
                radial-gradient(circle at 30% 25%,
                    #fff3b0,
                    #ffc107 35%,
                    #b77900 100%);

            border: 3px solid rgba(255, 215, 80, 0.8);
            border-radius: 50%;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.5),
                0 0 25px rgba(255, 193, 7, 0.35),
                inset 0 2px 5px rgba(255, 255, 255, 0.45);

            transition: 0.3s ease;
        }

        .admin-profile:hover .admin-avatar {
            transform: scale(1.08) rotate(3deg);
        }

        /* Admin Name */
        .admin-profile #adminName {
            margin: 5px 0 3px;

            color: #ffc107;

            font-size: 25px;
            font-weight: 700;

            text-shadow:
                0 2px 8px rgba(255, 193, 7, 0.35);
        }

        /* Subtitle */
        .admin-profile p {
            margin-bottom: 18px;

            color: #bdbdbd;

            font-size: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Logout Button */
        .admin-profile .btn-danger {
            padding: 10px 28px;

            border: 1px solid rgba(255, 100, 100, 0.6);
            border-radius: 12px;

            font-weight: 700;

            box-shadow:
                0 8px 18px rgba(220, 53, 69, 0.25),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);

            transition: all 0.3s ease;
        }

        .admin-profile .btn-danger:hover {
            transform: translateY(-3px) scale(1.04);

            box-shadow:
                0 12px 25px rgba(220, 53, 69, 0.4),
                0 0 18px rgba(255, 70, 70, 0.2);
        }

        /* Mobile */
        @media (max-width: 576px) {

            .admin-profile {
                width: 94%;
                padding: 22px 15px;
                border-radius: 20px;
            }

            .admin-avatar {
                width: 65px;
                height: 65px;
                font-size: 32px;
            }

            .admin-profile #adminName {
                font-size: 22px;
            }
        }

        ) !important;

    box-shadow:
        0 8px 20px rgba(220, 53, 69, 0.35),

}

.admin-profile .btn-danger:hover {

        0 12px 28px rgba(220, 53, 69, 0.5),

    <div class="container py-4">

        <h1 class="text-warning text-center mb-4">
            AlHayat Admin Panel

        <div class="admin-profile text-center mb-4">

            <div class="admin-avatar">
                <img src="admin.png" alt="Administrator">
            </div>

            <h3 id="adminName">Admin</h3>

            <p>Administrator</p>

            <button class="btn btn-danger" onclick="logoutAdmin()">
                🚪 Logout
            </button>

        </div>

        <!-- Dashboard -->

        <div class="row mb-4">

            <div class="col-md-3 mb-3">
                <div class="card bg-primary text-white text-center p-3">
                    <h2 id="totalOrders">0</h2>
                    <h5>Total Orders</h5>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="card bg-warning text-dark text-center p-3">
                    <h2 id="pendingOrders">0</h2>
                    <h5>Pending</h5>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="card bg-success text-white text-center p-3">
                    <h2 id="deliveredOrders">0</h2>
                    <h5>Delivered</h5>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="card bg-danger text-white text-center p-3">
                    <h2 id="totalRevenue">₹0</h2>
                    <h5>Total Revenue</h5>
                </div>
            </div>

        </div>
        <div class="card p-4 mt-4">
            <h3 class="text-center text-warning">
                Sales Analytics
            </h3>

            <canvas id="salesChart"></canvas>
        </div>
        <div class="card p-3 mt-4">
            <h3 class="text-center text-success">
                Best Selling Items
            </h3>

            <div id="bestSellingItems"></div>
        </div>

        <!-- Search -->

        <input type="text" id="searchOrder" class="form-control mb-3" placeholder="🔍 Search Customer..."
            onkeyup="loadOrders()">

        <!-- Filter -->

        <select id="statusFilter" class="form-select mb-4" onchange="loadOrders()">

            <option value="">All Orders</option>
            <option value="Pending">Pending</option>
            <option value="Accepted">Accepted</option>
            <option value="Delivered">Delivered</option>
            <option value="Preparing">Preparing</option>
            <option value="Out For Delivery">Out For Delivery</option>
        </select>

        <!-- Orders -->

        <div id="orders"></div>
        <h2 class="text-warning mt-5">
            Table Reservations
        </h2>

        <div id="reservationList" class="row g-3">
        </div>

    </div>
    <audio id="notificationSound">
        <source src="notification.mp3" type="audio/mpeg">
    </audio>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://alhayat-ai-restaurant-backend.onrender.com/socket.io/socket.io.js"></script>

    <script src="admin.js"></script>
