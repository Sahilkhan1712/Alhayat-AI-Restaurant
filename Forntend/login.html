<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AlHayat AI Restaurant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="bg-dark">

    <div class="container d-flex justify-content-center align-items-center vh-100">

        <div class="card p-4 shadow-lg" style="width:400px; border-radius:15px;">

            <h2 class="text-center text-warning mb-4">
                AlHayat AI
            </h2>

            <h4 class="text-center mb-4">
                Login
            </h4>

            <input type="email" id="email" class="form-control mb-3" placeholder="Email">

            <input type="password" id="password" class="form-control mb-3" placeholder="Password">

            <button class="btn btn-warning w-100" onclick="login()">

                Login

            </button>

            <button type="button"
                class="btn btn-light w-100 fw-bold d-flex align-items-center justify-content-center gap-2"
                onclick="loginWithGoogle()">

                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="20"
                    height="20">

                Continue with Google

            </button>

            <p class="text-center mt-3">

                Don't have an account?

                <a href="signup.html">
                    Signup
                </a>

            </p>

        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
